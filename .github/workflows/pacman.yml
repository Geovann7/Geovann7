
name: Gerar Pac-Man das contribuicoes

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20

    steps:
      - name: Gerar animacao do Pac-Man
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: Geovann7
          games: pacman

      - name: Publicar imagens na branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
