
name: Gerar Pac-Man das contribuicoes

on:
  # Atualiza automaticamente todos os dias
  schedule:
    - cron: "17 9 * * *"

  # Atualiza quando o README for modificado
  push:
    branches:
      - main
    paths:
      - "README.md"

  # Permite executar manualmente, se desejar
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Gerar Pac-Man
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: Geovann7
          games: pacman

      - name: Publicar animacao
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
